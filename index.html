<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C8364A" />
    <meta name="description" content="Lounaspaikat Tampereen keskustassa – valitse kategoria tai arvo paikka." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Lounas – Tampere</title>
    <script>
      // Apply the saved theme before first paint (avoids a light flash in dark mode).
      try {
        var t = JSON.parse(localStorage.getItem('lounas.theme.v1') || 'null');
        var v = t && t.state && t.state.theme;
        if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
